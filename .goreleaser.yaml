version: 2

builds:
  - id: syncd
    main: ./cmd/syncd
    binary: syncd
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}}
      - -X github.com/amitavroy/burrow/internal/drive.ClientID={{.Env.BURROW_GOOGLE_CLIENT_ID}}
      - -X github.com/amitavroy/burrow/internal/drive.ClientSecret={{.Env.BURROW_GOOGLE_CLIENT_SECRET}}

  - id: syncui
    main: ./cmd/syncui
    binary: syncui
    env: [CGO_ENABLED=0]
    goos: [linux, windows] # macOS needs cgo: build it on a Mac with `make build-ui`
    goarch: [amd64, arm64]
    ldflags:
      - -s -w{{ if eq .Os "windows" }} -H=windowsgui{{ end }}

archives:
  - formats: [tar.gz]
    allow_different_binary_count: true # macOS ships syncd only
    name_template: "burrow_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: amitavroy
    name: burrow

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

nfpms:
  - id: burrow
    package_name: burrow-drive
    ids: [syncd, syncui]
    formats: [deb]
    maintainer: Amitav Roy <reachme@amitavroy.com>
    homepage: https://github.com/amitavroy/burrow
    description: Mirror a local folder to Google Drive (daemon and tray icon).
    bindir: /usr/bin
    file_name_template: "burrow-drive_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    contents:
      # Starts the tray for every user at their next login. A user's own
      # ~/.config/autostart file of the same name (written by `syncd service install`) wins.
      - src: packaging/burrow-syncui.desktop
        dst: /etc/xdg/autostart/burrow-syncui.desktop
        type: config|noreplace
        file_info:
          mode: 0644
      # Makes "Burrow" searchable in the app menu, so the tray can be started at once
      # after install, without a relogin.
      - src: packaging/burrow.desktop
        dst: /usr/share/applications/burrow.desktop
        file_info:
          mode: 0644
      - src: packaging/burrow.png
        dst: /usr/share/icons/hicolor/256x256/apps/burrow.png
        file_info:
          mode: 0644
    scripts:
      preremove: packaging/prerm.sh
